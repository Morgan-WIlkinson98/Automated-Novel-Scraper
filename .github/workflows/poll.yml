name: Poll NovelUpdates

on:
  schedule:
    # Every 30 min on off-peak minutes
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: none

concurrency:
  group: novel-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-poller.txt

      - name: Install dependencies
        run: pip install -r requirements-poller.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-poller.txt') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps
          sudo apt-get install -y xvfb

      - name: Run poller
        env:
          DB_TYPE: firestore
          RSS_FEED_URL: ${{ secrets.NU_RSS_FEED_URL }}
          NOVELUPDATES_COOKIES: ${{ secrets.NU_COOKIES }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SERIES_SYNC_INLINE: '1'
          EXPORT_DIR: ${{ runner.temp }}/exports
          # Headless Chromium never clears NU's Cloudflare challenge;
          # run headed under a virtual display.
          NU_HEADED: '1'
        run: xvfb-run -a python poller.py
