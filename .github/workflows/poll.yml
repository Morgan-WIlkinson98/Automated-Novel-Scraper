name: Poll NovelUpdates

on:
  schedule:
    # Every 30 min on off-peak minutes
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      slug:
        description: "Optional: process only this novels_requests slug (skips RSS)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: novel-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Official Playwright image — browsers and all system deps are baked
    # in, so no per-run apt/browser install. Pinned to match
    # requirements-poller.txt's playwright version (mismatched versions
    # would trigger a fresh browser download).
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
      options: --user root  # image defaults to pwuser; root for checkout/apt
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: python3 -m pip install -r requirements-poller.txt

      - name: Playwright sanity
        # Image already ships matching browsers — this is a fast no-op
        # unless requirements and the image tag drift apart.
        run: |
          python3 -m playwright install chromium
          command -v xvfb-run || (apt-get update && apt-get install -y xvfb)

      - name: Run poller
        env:
          DB_TYPE: firestore
          RSS_FEED_URL: ${{ secrets.NU_RSS_FEED_URL }}
          NOVELUPDATES_COOKIES: ${{ secrets.NU_COOKIES }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SERIES_SYNC_INLINE: '1'
          EXPORT_DIR: ${{ runner.temp }}/exports
          # Headless Chromium never clears NU's Cloudflare challenge;
          # run headed under a virtual display.
          NU_HEADED: '1'
          POLL_ONLY_SLUG: ${{ inputs.slug }}
        run: xvfb-run -a python3 poller.py
