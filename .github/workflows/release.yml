name: Build and Release Novel Scraper

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build standalone app
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            SEP=";"
            DIST="dist/windows"
          else
            SEP=":"
            DIST="dist/macos"
          fi
          python -m PyInstaller \
            --name "NovelScraper" \
            --windowed \
            --onefile \
            --add-data "templates${SEP}templates" \
            --distpath "${DIST}" \
            desktop_app.py

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          cd dist/macos
          zip -r "NovelScraper-macOS.zip" "NovelScraper.app"

      - name: Package Windows exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd dist/windows
          Compress-Archive -Path "NovelScraper.exe" -DestinationPath "NovelScraper-Windows.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.os }}-build
          path: dist/*/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            TITLE="NovelScraper ${{ github.ref_name }}"
          else
            TAG="manual-${{ github.run_number }}"
            TITLE="NovelScraper manual build ${{ github.run_number }}"
          fi
          gh release create "$TAG" artifacts/*.zip \
            --title "$TITLE" \
            --generate-notes \
            --prerelease="${{ github.event_name == 'workflow_dispatch' }}"
