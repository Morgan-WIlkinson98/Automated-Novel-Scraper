name: Build and Release Novel Scraper

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Check if PR is draft
        if: github.event_name == 'pull_request'
        run: |
          if [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "Skipping build for draft PR"
            exit 0
          fi

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build standalone app
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            SEP=";"
            DIST="dist/windows"
            ICON="BookIcon.ico"
          else
            SEP=":"
            DIST="dist/macos"
            ICON="BookIcon.icns"
          fi
          python -m PyInstaller \
            --name "NovelScraper" \
            --windowed \
            --onefile \
            --icon "${ICON}" \
            --add-data "templates${SEP}templates" \
            --distpath "${DIST}" \
            desktop_app.py

      - name: Package macOS app as DMG
        if: runner.os == 'macOS'
        run: |
          APP="dist/macos/NovelScraper.app"
          DMG="dist/macos/NovelScraper.dmg"
          TMP_DMG="dist/macos/NovelScraper-tmp.dmg"
          MOUNT_DIR=$(mktemp -d)
          VOL="Novel Scraper"

          # Size the temporary image to the app plus a 200 MB buffer
          APP_SIZE=$(du -sm "$APP" | awk '{print $1}')
          SIZE="$((APP_SIZE + 200))m"

          rm -f "$TMP_DMG"
          hdiutil create -ov -size "$SIZE" -volname "$VOL" -fs HFS+ -o "$TMP_DMG"
          hdiutil attach -mountpoint "$MOUNT_DIR" -nobrowse -noverify "$TMP_DMG"

          cp -R "$APP" "$MOUNT_DIR/"
          ln -s /Applications "$MOUNT_DIR/Applications"

          hdiutil detach "$MOUNT_DIR"
          hdiutil convert "$TMP_DMG" -format UDZO -o "$DMG"
          rm -f "$TMP_DMG"
          rmdir "$MOUNT_DIR" 2>/dev/null || true

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: macos-latest-build
          path: dist/macos/NovelScraper.dmg

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-latest-build
          path: dist/windows/NovelScraper.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Compute release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          def run(cmd):
              return subprocess.check_output(cmd, text=True)

          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['GITHUB_REF_NAME']

          try:
              raw = run(['gh', 'release', 'list', '--json', 'tagName', '-L', '100'])
              data = json.loads(raw)
              tags = [item['tagName'] for item in data if 'tagName' in item]
          except Exception:
              tags = []

          # Find latest main version like 1.0, 2.3, etc.
          main_re = re.compile(r'^(\d+)\.(\d+)$')
          main_versions = []
          for t in tags:
              m = main_re.match(t)
              if m:
                  main_versions.append((int(m.group(1)), int(m.group(2))))

          if not main_versions:
              base = (1, 0)
          else:
              base = max(main_versions)

          # Main releases: 1.0 -> 1.1 -> 1.2
          new_base = (base[0], base[1] + 1)
          version = f"{new_base[0]}.{new_base[1]}"
          suffix = ''

          print(f"version={version}")
          print(f"suffix={suffix}", file=sys.stderr)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"version={version}\n")
              f.write(f"suffix={suffix}\n")
          PY

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SUFFIX="${{ steps.version.outputs.suffix }}"
          TITLE="NovelScraper ${VERSION}${SUFFIX}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PRERELEASE="false"
          else
            PRERELEASE="true"
          fi
          ASSET_FILES=$(find artifacts -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' \))
          if [ -z "$ASSET_FILES" ]; then
            echo "No release assets found"
            exit 1
          fi
          gh release create "$VERSION" $ASSET_FILES \
            --title "$TITLE" \
            --generate-notes \
            --prerelease="$PRERELEASE"
