events {
    worker_connections 1024;
}

http {
    upstream novel_scraper {
        server novel-scraper:6110;
    }

    server {
        listen 80;
        server_name novelscraper.local;

        location / {
            proxy_pass http://novel_scraper;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Default server - can be used for other apps later
    server {
        listen 80 default_server;
        server_name _;

        location / {
            return 404 "No service configured for this host. Add your app's configuration to nginx.conf\n";
        }
    }
}
